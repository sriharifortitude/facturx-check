[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "facturx-check"
version = "0.1.0"
description = "Inspect Factur-X / ZUGFeRD hybrid e-invoices: the PDF/A-3 wrapper, the XMP metadata, and the embedded XML, against each other."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Sri Hari Manikandan" }]
keywords = ["factur-x", "zugferd", "e-invoicing", "pdf", "en16931", "xrechnung"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = ["pypdf>=6.20", "defusedxml>=0.7.1"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "mypy>=1.13", "ruff>=0.8"]

[project.scripts]
facturx-check = "facturx_check.cli:main"

[project.urls]
Repository = "https://github.com/sriharifortitude/facturx-check"

[tool.hatch.build.targets.wheel]
packages = ["src/facturx_check"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "S", "PL", "N", "C4", "T20", "DTZ"]
ignore = ["PLR2004", "S101", "PLR0913", "PLR0911", "PLR0912", "PLR0917", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN", "PLR", "T20", "E501"]
"src/facturx_check/rules.py" = ["E501"]
"src/facturx_check/cli.py" = ["T20"]
"src/facturx_check/report.py" = ["T20"]
"scripts/*" = ["T20"]
# pypdf hands back dynamically typed objects; typing them as Any is the honest annotation.
"src/facturx_check/pdf.py" = ["ANN401"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
